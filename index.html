<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Dev | Cyber Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">◈</span>
            <span>AHMED <span class="green-text">DEV</span></span>
        </div>
        <div class="nav-links">
            <a href="#" class="active" id="nav-home">Home</a>
            <a href="#" id="nav-about">About</a>
            <a href="#" id="nav-projects">Projects</a>
            <a href="#" id="nav-tools">Tools</a>
            <!-- زرار اللغة -->
            <a href="#" class="lang-btn" id="lang-btn" onclick="toggleLanguage(event)">العربية</a>
        </div>
    </nav>

    <!-- القسم الرئيسي -->
    <section class="hero-section">
        <div class="content-wrapper">
            
            <div class="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">SYSTEM ONLINE</span>
            </div>

            <p class="welcome-text" id="welcome-text">WELCOME TO MY DIGITAL WORLD</p>
            <h1 class="main-title">AHMED <span class="green-text">DEV</span></h1>
            <h2 class="subtitle" id="subtitle-text">BUILD. CODE. CREATE.</h2>
            
            <p class="description" id="desc-text">
                Exploring programming, web development, and creating digital experiences. 
                Turning ideas into reality through clean code and creative design.
            </p>

        </div>
    </section>

    <!-- كود تغيير اللغة (JavaScript) -->
    <script>
        let isArabic = false;

        function toggleLanguage(event) {
            if (event) event.preventDefault(); 
            isArabic = !isArabic;

            // تغيير اتجاه الصفحة
            document.documentElement.dir = isArabic ? "rtl" : "ltr";
            document.documentElement.lang = isArabic ? "ar" : "en";

            // تغيير النصوص
            document.getElementById("nav-home").textContent = isArabic ? "الرئيسية" : "Home";
            document.getElementById("nav-about").textContent = isArabic ? "من أنا" : "About";
            document.getElementById("nav-projects").textContent = isArabic ? "المشاريع" : "Projects";
            document.getElementById("nav-tools").textContent = isArabic ? "الأدوات" : "Tools";
            
            document.getElementById("lang-btn").textContent = isArabic ? "English" : "العربية";
            document.getElementById("status-text").textContent = isArabic ? "النظام يعمل" : "SYSTEM ONLINE";
            document.getElementById("welcome-text").textContent = isArabic ? "مرحباً بكم في عالمي الرقمي" : "WELCOME TO MY DIGITAL WORLD";
            document.getElementById("subtitle-text").textContent = isArabic ? "ابنِ. برمج. ابتكر." : "BUILD. CODE. CREATE.";
            
            document.getElementById("desc-text").textContent = isArabic 
                ? "استكشاف البرمجة، تطوير الويب، وابتكار تجارب رقمية. تحويل الأفكار إلى واقع من خلال كود نظيف وتصميم إبداعي." 
                : "Exploring programming, web development, and creating digital experiences. Turning ideas into reality through clean code and creative design.";
        }
    </script>

</body>
</html>
