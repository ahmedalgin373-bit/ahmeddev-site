<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Dev | Cyber Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الذكاء الاصطناعي -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">◈</span>
            <span>AHMED <span class="green-text">DEV</span></span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active" data-en="Home" data-ar="الرئيسية">Home</a>
            <a href="#" data-en="About" data-ar="من أنا">About</a>
            <a href="#" data-en="Projects" data-ar="المشاريع">Projects</a>
            <a href="resources.html" data-en="Resources" data-ar="المصادر">Resources</a>
            <a href="#" class="lang-btn" id="lang-btn" onclick="toggleLanguage(event)">العربية</a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="content-wrapper">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span data-en="SYSTEM ONLINE" data-ar="النظام يعمل">SYSTEM ONLINE</span>
            </div>
            <p class="welcome-text" data-en="WELCOME TO MY DIGITAL WORLD" data-ar="مرحباً بكم في عالمي الرقمي">WELCOME TO MY DIGITAL WORLD</p>
            <h1 class="main-title">AHMED <span class="green-text">DEV</span></h1>
            <h2 class="subtitle" data-en="BUILD. CODE. CREATE." data-ar="ابنِ. برمج. ابتكر.">BUILD. CODE. CREATE.</h2>
            <p class="description" data-en="Exploring programming, web development, and creating digital experiences." data-ar="استكشاف البرمجة، تطوير الويب، وابتكار تجارب رقمية.">
                Exploring programming, web development, and creating digital experiences.
            </p>
        </div>
    </section>

    <!-- واجهة الشات بوت -->
    <button class="ai-chat-btn" onclick="toggleAIChat()">🤖</button>
    
    <div class="ai-chat-box" id="ai-chat-box">
        <div class="ai-chat-header">
            <span>Ahmed's AI Assistant</span>
            <span style="cursor:pointer;" onclick="toggleAIChat()">✖</span>
        </div>
        <div class="ai-chat-messages" id="ai-messages">
            <div class="ai-msg bot">أهلاً بك! أنا المساعد الذكي. اسألني أي حاجة!</div>
        </div>
        <div class="ai-chat-input-area">
            <input type="text" id="ai-input" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key === 'Enter') sendAIMessage()">
            <button onclick="sendAIMessage()">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
<button class="ai-chat-btn" onclick="toggleAIChat()">🤖</button>
</body>
</html>
